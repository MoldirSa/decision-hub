<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Hub — Transactional Model Grooming</title>
<style>
/* ============================================================
   RESET & DESIGN TOKENS
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,fieldset,form{ margin:0; padding:0; }
ul{ list-style:none; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea,button{ font-family:inherit; font-size:inherit; color:inherit; }
a{ color:inherit; }

:root{
  --bg:#fafafa;
  --bg-elevated:#ffffff;
  --sidebar-bg:#f7f7f8;
  --border:#e4e4e7;
  --border-strong:#d4d4d8;
  --text:#18181b;
  --text-muted:#71717a;
  --text-faint:#a1a1aa;
  --accent:#3b82f6;
  --accent-fg:#ffffff;
  --danger:#dc2626;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
}

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:#d4d4d8; border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.muted{ color:var(--text-muted); font-size:12.5px; }
.secondary-ui{ transition:opacity .15s; }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{ display:flex; height:100vh; overflow:hidden; }

.sidebar{
  width:240px; flex:0 0 240px;
  background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  padding:16px 12px;
  overflow-y:auto;
}
.sidebar-brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 18px; }
.brand-mark{
  width:32px; height:32px; border-radius:8px;
  background:var(--text); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; flex:none;
}
.brand-title{ font-weight:600; font-size:14px; line-height:1.2; }
.brand-sub{ font-size:11px; color:var(--text-muted); margin-top:1px; }

.sidebar-nav{ display:flex; flex-direction:column; gap:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left; border:none; background:transparent;
  padding:8px 10px; border-radius:var(--radius-sm);
  color:var(--text-muted); font-size:13.5px; font-weight:500;
  transition:background .12s,color .12s;
}
.nav-item:hover{ background:#eeeef0; color:var(--text); }
.nav-item.active{ background:var(--text); color:#fff; }
.nav-icon{ width:18px; text-align:center; flex:none; font-size:13px; }

.main-col{ flex:1; display:flex; flex-direction:column; min-width:0; }

.topbar{
  display:flex; align-items:center; gap:12px;
  padding:10px 20px; border-bottom:1px solid var(--border);
  background:var(--bg-elevated);
  flex:none;
}
.search-wrap{ flex:1; max-width:480px; }
#search-input{
  width:100%; padding:8px 12px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--bg);
  outline:none; transition:border-color .12s;
}
#search-input:focus{ border-color:var(--accent); background:#fff; }
.topbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; }

#main-content{ flex:1; overflow-y:auto; padding:24px 28px 60px; }

.view-header{ margin-bottom:18px; }
.view-header h1{ font-size:21px; font-weight:650; letter-spacing:-.01em; }
.view-header p{ margin-top:4px; }

/* ============================================================
   BUTTONS / BADGES / TAGS
   ============================================================ */
.btn-primary,.btn-secondary,.btn-danger,.btn-mini{
  border-radius:var(--radius-sm); border:1px solid transparent;
  padding:7px 13px; font-size:13px; font-weight:500;
  white-space:nowrap; transition:background .12s,border-color .12s,opacity .12s;
}
.btn-primary{ background:var(--text); color:#fff; }
.btn-primary:hover{ opacity:.85; }
.btn-secondary{ background:#fff; border-color:var(--border-strong); color:var(--text); }
.btn-secondary:hover{ background:#f4f4f5; }
.btn-secondary.active{ background:var(--text); color:#fff; border-color:var(--text); }
.btn-danger{ background:#fff; border-color:#fecaca; color:var(--danger); }
.btn-danger:hover{ background:#fef2f2; }
.btn-mini{ padding:5px 10px; font-size:12px; background:#fff; border-color:var(--border-strong); }
.btn-mini:hover{ background:#f4f4f5; }
.link-btn{ border:none; background:none; color:var(--accent); font-size:12.5px; text-decoration:underline; padding:0; }
.icon-btn{
  border:none; background:transparent; width:30px; height:30px;
  border-radius:var(--radius-sm); font-size:16px; color:var(--text-muted);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.icon-btn:hover{ background:#f0f0f1; color:var(--text); }
.icon-btn.danger:hover{ background:#fef2f2; color:var(--danger); }
.mobile-only{ display:none; }

.badge{
  display:inline-block; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:600; white-space:nowrap;
}
.tag{
  display:inline-flex; align-items:center; gap:5px;
  background:#f0f0f1; border-radius:999px; padding:3px 10px;
  font-size:12px; color:var(--text);
}
.tag.mini{ padding:2px 8px; font-size:11px; cursor:pointer; }
.tag.mini:hover{ background:#e4e4e7; }
.tag button{ border:none; background:none; color:var(--text-muted); font-size:13px; line-height:1; padding:0; }
.tag button:hover{ color:var(--danger); }
.dept-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; flex:none; }
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

/* ============================================================
   FILTER BAR
   ============================================================ */
.filter-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.filter-bar select{
  padding:6px 10px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  background:#fff; color:var(--text); font-size:12.5px;
}

/* ============================================================
   STAT GRID / PANELS / READINESS BARS  (Overview + CEO)
   ============================================================ */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
.stat-tile{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:14px 16px;
}
.stat-value{ font-size:24px; font-weight:700; letter-spacing:-.02em; }
.stat-label{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
.stat-tile.approved .stat-value{ color:#16a34a; }
.stat-tile.discussion .stat-value{ color:#d97706; }
.stat-tile.blocked .stat-value{ color:#dc2626; }

.panel{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:18px;
}
.panel h2{ font-size:15px; font-weight:650; margin-bottom:14px; }
.panel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }

.readiness-overall{ display:flex; align-items:center; gap:12px; margin-bottom:16px; font-weight:600; font-size:13px; }
.readiness-row{ display:grid; grid-template-columns:150px 1fr 90px; align-items:center; gap:12px; margin-bottom:10px; font-size:13px; }
.readiness-label{ display:flex; align-items:center; }
.readiness-bar{ height:8px; background:#eee; border-radius:999px; overflow:hidden; flex:1; }
.readiness-fill{ height:100%; background:var(--text); border-radius:999px; transition:width .2s; }
.readiness-pct{ text-align:right; font-variant-numeric:tabular-nums; }

.mini-stat-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f1f1f2; font-size:13px; }
.mini-stat-row:last-child{ border-bottom:none; }
.blocker-row{
  display:flex; align-items:center; gap:8px; padding:8px 6px;
  border-radius:var(--radius-sm); cursor:pointer; font-size:13px;
}
.blocker-row:hover{ background:#f6f6f7; }
.blocker-title{ font-weight:500; flex:1; }

/* ============================================================
   CARD TILES / GRID
   ============================================================ */
.tile-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.card-tile{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:14px 16px; cursor:pointer;
  transition:box-shadow .12s,border-color .12s;
}
.card-tile:hover{ box-shadow:var(--shadow-md); border-color:var(--border-strong); }
.card-tile.dragging{ opacity:.4; }
.tile-top{ display:flex; gap:6px; margin-bottom:8px; }
.card-tile h3{ font-size:14px; font-weight:600; margin-bottom:4px; line-height:1.3; }
.tile-desc{
  font-size:12.5px; color:var(--text-muted); margin-bottom:10px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.tile-meta{ display:flex; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); }
.tile-progress{ height:5px; background:#eee; border-radius:999px; overflow:hidden; margin-top:10px; }
.tile-progress-bar{ height:100%; background:#16a34a; }
.tile-progress-label{ display:block; margin-top:4px; font-size:11px; }

/* ============================================================
   KANBAN
   ============================================================ */
.kanban-board{ display:flex; gap:16px; align-items:flex-start; overflow-x:auto; padding-bottom:20px; }
.kanban-col{ background:#f4f4f5; border-radius:var(--radius-lg); padding:12px; width:290px; flex:0 0 290px; }
.kanban-col-head{ display:flex; align-items:center; gap:8px; padding:4px 6px 10px; }
.kanban-col-head h3{ font-size:13px; font-weight:650; }
.kanban-col-head .count{ margin-left:auto; font-size:12px; color:var(--text-muted); background:#e4e4e7; padding:1px 8px; border-radius:999px; }
.kanban-col-body{ display:flex; flex-direction:column; gap:10px; min-height:80px; border-radius:var(--radius-md); transition:background .12s,outline .12s; padding:2px; }
.kanban-col-body.drag-over{ background:#eef2ff; outline:2px dashed #a5b4fc; }

/* ============================================================
   DEVELOPMENT AUTO-VIEW
   ============================================================ */
.dev-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:22px; align-items:start; }
.dev-col{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; }
.dev-col h3{ font-size:13px; font-weight:650; margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); }
.dev-req{ padding:9px 0; border-bottom:1px solid #f1f1f2; }
.dev-req:last-child{ border-bottom:none; }
.dev-req-label{ font-size:13px; font-weight:600; }
.dev-req-group{ font-size:11px; margin:1px 0 6px; }
.dev-req-sources{ display:flex; flex-wrap:wrap; gap:5px; }

/* ============================================================
   DEPENDENCY GRAPH
   ============================================================ */
.graph-wrap{ position:relative; overflow:auto; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg-elevated); padding:32px; min-height:300px; }
#graph-svg{ position:absolute; top:0; left:0; z-index:0; pointer-events:none; }
.graph-columns{ display:flex; gap:70px; position:relative; z-index:1; }
.graph-col{ display:flex; flex-direction:column; gap:22px; }
.graph-node{
  width:190px; background:#fff; border:1.5px solid var(--border-strong); border-left-width:4px;
  border-radius:var(--radius-md); padding:10px 12px; cursor:pointer; box-shadow:var(--shadow-sm);
}
.graph-node:hover{ box-shadow:var(--shadow-md); }
.graph-node-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-bottom:6px; }
.graph-node-title{ font-size:12.5px; font-weight:600; line-height:1.3; }
.graph-node-dept{ font-size:10.5px; color:var(--text-muted); margin-top:3px; }

/* ============================================================
   MERMAID INTERACTION SCHEME
   ============================================================ */
.mermaid-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; background:var(--bg-elevated); }
.mermaid-wrap .mermaid{ display:flex; justify-content:center; }
.mermaid-wrap svg{ max-width:none; }
.mermaid-source-input{
  width:100%; min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px; line-height:1.5; padding:10px 12px; border:1px solid var(--border-strong);
  border-radius:var(--radius-sm); resize:vertical; background:#fff; color:var(--text);
}
.tab-bar{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.tab-bar .btn-mini.active{ background:var(--text); color:#fff; border-color:var(--text); }

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.35);
  display:flex; align-items:flex-start; justify-content:center;
  padding:5vh 16px; overflow-y:auto; z-index:1000;
}
.modal{
  background:#fff; border-radius:var(--radius-lg); width:640px; max-width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.25); padding:22px 24px 26px;
}
.modal-header{ display:flex; align-items:flex-start; gap:10px; margin-bottom:4px; }
.modal-header-main{ display:flex; align-items:flex-start; gap:8px; flex:1; }
.modal-header h2{ font-size:19px; font-weight:650; line-height:1.3; outline:none; cursor:text; }
.modal-header h2:hover{ background:#f7f7f8; border-radius:4px; }
.modal-meta{ margin-bottom:16px; }
.modal-fields{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.field{ margin-bottom:14px; }
.field > label{ display:block; font-size:11.5px; font-weight:650; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-bottom:6px; }
.field select,.field input[type=text],.field textarea{
  width:100%; padding:7px 9px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); background:#fff;
}
.editable-text{ padding:5px 7px; border-radius:var(--radius-sm); cursor:text; min-height:20px; white-space:pre-wrap; }
.editable-text:hover{ background:#f7f7f8; }
.editable-text.block{ line-height:1.5; }
.inline-edit-box{ width:100%; padding:6px 8px; border:1px solid var(--accent); border-radius:var(--radius-sm); outline:none; }
.country-tags{ display:flex; gap:6px; margin:-6px 0 14px; flex-wrap:wrap; }

.dep-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.dep-tag{ background:#eef2ff; color:#3730a3; }
.field select#dep-select,.dep-chips + select{ max-width:280px; }

.chk-group{ border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:10px; }
.chk-group-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.chk-group-head h4{ font-size:12.5px; font-weight:650; cursor:text; padding:2px 4px; border-radius:4px; }
.chk-group-head h4:hover{ background:#f7f7f8; }
.chk-items{ display:flex; flex-direction:column; gap:2px; }
.chk-item{ display:flex; align-items:center; justify-content:space-between; padding:3px 2px; border-radius:4px; }
.chk-item:hover{ background:#f9f9fa; }
.chk-item label{ display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; flex:1; }
.chk-item input[type=checkbox]{ width:15px; height:15px; accent-color:var(--text); flex:none; }
.chk-item span[data-editable]{ cursor:text; padding:1px 3px; border-radius:3px; }
.chk-item span[data-editable]:hover{ background:#eee; }

.inline-add-form{ display:flex; gap:6px; margin-top:8px; }
.inline-add-input{ flex:1; padding:6px 9px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); }

.comments-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; max-height:220px; overflow-y:auto; }
.comment{ background:#f7f7f8; border-radius:var(--radius-sm); padding:8px 10px; }
.comment-head{ display:flex; justify-content:space-between; margin-bottom:3px; font-size:12.5px; }
.comment div:last-child{ font-size:13px; }
.comment-form{ display:flex; flex-direction:column; gap:6px; }
.comment-author-input{ padding:6px 9px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); max-width:220px; }
.comment-text-input{ padding:7px 9px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); resize:vertical; }

.modal-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }

/* Export menu */
.export-wrap{ position:relative; }
.export-menu{
  display:none; position:absolute; right:0; top:calc(100% + 6px);
  background:#fff; border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow-md); min-width:170px; padding:6px; z-index:200;
}
.export-menu.open{ display:block; }
.export-menu button{ display:block; width:100%; text-align:left; border:none; background:none; padding:7px 9px; border-radius:6px; font-size:13px; }
.export-menu button:hover{ background:#f4f4f5; }
.export-menu hr{ border:none; border-top:1px solid var(--border); margin:4px 0; }

/* New card modal */
.new-card-modal .modal-fields{ grid-template-columns:repeat(2,1fr); }

/* ============================================================
   SESSION / HYPOTHESES
   ============================================================ */
.user-chip{
  display:flex; align-items:center; gap:8px;
  padding:4px 10px 4px 6px; border:1px solid var(--border-strong);
  border-radius:999px; background:#fff; font-size:12.5px; cursor:pointer;
  max-width:240px;
}
.user-chip:hover{ background:#f4f4f5; }
.user-chip-name{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-chip-dept{ color:var(--text-muted); font-size:11.5px; white-space:nowrap; }
.hyp-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.hyp-toolbar .filter-bar{ margin:0; flex:1; }
.hyp-table-wrap{ overflow-x:auto; }
.hyp-table{ width:100%; border-collapse:collapse; font-size:13px; }
.hyp-table th{
  text-align:left; font-size:11.5px; font-weight:650; text-transform:uppercase;
  letter-spacing:.03em; color:var(--text-muted); padding:8px 10px;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
.hyp-table td{ padding:10px; border-bottom:1px solid #f1f1f2; vertical-align:top; }
.hyp-table tr[data-action]:hover{ background:#fafafa; }
.hyp-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.timeline{ display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
.timeline-item{ font-size:12.5px; padding:8px 10px; background:#f7f7f8; border-radius:var(--radius-sm); }
.auth-panel{ max-width:420px; }
.auth-hint{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
.dash-dept-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
.dash-dept-card{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:14px 16px; cursor:pointer; text-align:left; width:100%;
}
.dash-dept-card:hover{ box-shadow:var(--shadow-md); border-color:var(--border-strong); }
.dash-dept-card h3{ font-size:13.5px; font-weight:650; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.dash-dept-metric{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--text-muted); }
.dash-dept-metric b{ color:var(--text); }
.queue-item{
  display:flex; align-items:flex-start; gap:10px; padding:10px 8px;
  border-bottom:1px solid #f1f1f2; cursor:pointer; border-radius:var(--radius-sm);
}
.queue-item:hover{ background:#f6f6f7; }
.queue-item:last-child{ border-bottom:none; }
.queue-title{ font-weight:600; font-size:13.5px; }
@media (max-width:1024px){
  .dash-dept-grid{ grid-template-columns:repeat(2,1fr); }
}

/* ============================================================
   MEETING MODE
   ============================================================ */
body.meeting-mode .secondary-ui{ display:none !important; }
body.meeting-mode #main-content{ padding:32px 40px 60px; }
body.meeting-mode .card-tile{ padding:22px 24px; }
body.meeting-mode .card-tile h3{ font-size:18px; }
body.meeting-mode .tile-desc{ font-size:14px; -webkit-line-clamp:3; }
body.meeting-mode .badge{ font-size:13px; padding:5px 12px; }
body.meeting-mode .view-header h1{ font-size:28px; }
body.meeting-mode .chk-item input[type=checkbox]{ width:22px; height:22px; }
body.meeting-mode .chk-item label{ font-size:16px; }
body.meeting-mode .chk-group-head h4{ font-size:15px; }
body.meeting-mode .modal{ width:760px; }
body.meeting-mode .modal-header h2{ font-size:24px; }
body.meeting-mode .sidebar{ width:76px; }
body.meeting-mode .sidebar .nav-label,
body.meeting-mode .sidebar .brand-text{ display:none; }
body.meeting-mode .stat-value{ font-size:30px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1024px){
  .sidebar{ width:72px; }
  .sidebar .nav-label,.sidebar .brand-text{ display:none; }
  .panel-grid{ grid-template-columns:1fr; }
  .modal-fields{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:720px){
  .mobile-only{ display:flex; }

/* ============================================================
   UTILITIES
   ============================================================ */
function uid(prefix){
  return (prefix||'id') + '-' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function esc(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function deptColor(id){ const d = DEPARTMENTS.find(x=>x.id===id); return d ? d.color : '#666'; }
function orgById(id){ return ORG_UNITS.find(x=>x.id===id); }
function orgLabel(id){ const o = orgById(id); return o ? o.label : (id || '—'); }
function orgColor(id){ const o = orgById(id); return o ? o.color : '#666'; }
function hypStatus(id){ return HYPOTHESIS_STATUSES.find(s=>s.id===id) || HYPOTHESIS_STATUSES[0]; }
function hypBadge(statusId){
  const s = hypStatus(statusId);
  return '<span class="badge" style="background:'+s.bg+';color:'+s.fg+'">'+esc(s.label)+'</span>';
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; }
}
function saveSession(session){
  if(session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESSION_KEY);
}
function formatDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

class DataStore{
  constructor(){
    this.key = 'decisionHub_v1';
    this.listeners = [];
    this.cards = [];
    this.hypotheses = [];
    this.load();
  }
  load(){
    const raw = localStorage.getItem(this.key);
    if(raw){
      try{
        const parsed = JSON.parse(raw);
        this.cards = parsed.cards || [];
        this.hypotheses = Array.isArray(parsed.hypotheses) ? parsed.hypotheses : [];
        if(!Array.isArray(this.cards) || !this.cards.length) throw new Error('empty');
        if(!this.hypotheses.length){
          this.hypotheses = SeedData.buildHypotheses();
          this.save();
        }
      }catch(e){
        this.cards = SeedData.build();
        if(!this.hypotheses || !this.hypotheses.length) this.hypotheses = SeedData.buildHypotheses();
        this.save();
      }
    } else {
      this.cards = SeedData.build();
      this.hypotheses = SeedData.buildHypotheses();
      this.save();
    }
  }
  save(){
    localStorage.setItem(this.key, JSON.stringify({cards:this.cards, hypotheses:this.hypotheses, savedAt:Date.now()}));
    this.notify();
  }
  subscribe(fn){ this.listeners.push(fn); }
  notify(){ this.listeners.forEach(fn=>fn()); }
  getCard(id){ return this.cards.find(c=>c.id===id); }
  addCard(card){ this.cards.push(card); this.save(); }
  updateCard(id, patch){
    const c = this.getCard(id);
    if(!c) return;
    Object.assign(c, patch);
    c.updatedAt = Date.now();
    this.save();
  }
  deleteCard(id){
    this.cards = this.cards.filter(c=>c.id!==id);
    this.cards.forEach(c=>{ c.dependencies = c.dependencies.filter(d=>d!==id); });
    this.save();
  }
  replaceAll(cards){ this.cards = cards; this.save(); }
  getHypothesis(id){ return this.hypotheses.find(h=>h.id===id); }
  addHypothesis(h){ this.hypotheses.push(h); this.save(); }
  updateHypothesis(id, patch){
    const h = this.getHypothesis(id);
    if(!h) return;
    Object.assign(h, patch);
    h.updatedAt = Date.now();
    this.save();
  }
  deleteHypothesis(id){
    this.hypotheses = this.hypotheses.filter(h=>h.id!==id);
    this.save();
  }
}

/* ============================================================
   SEARCH / FILTER ENGINE
   ============================================================ */
class SearchEngine{
  static matches(card, query){
    if(!query) return true;
    const q = query.toLowerCase();
    if(card.title.toLowerCase().includes(q)) return true;
    if((card.description||'').toLowerCase().includes(q)) return true;
    if((card.owner||'').toLowerCase().includes(q)) return true;
    if(card.department.toLowerCase().includes(q)) return true;
    if((card.comments||[]).some(c => c.text.toLowerCase().includes(q) || c.author.toLowerCase().includes(q))) return true;
    return false;
  }
  static applyFilters(cards, filters){
    filters = filters || {};
    return cards.filter(c=>{
      if(filters.department && c.department !== filters.department) return false;
      if(filters.status && c.status !== filters.status) return false;
      if(filters.owner && c.owner !== filters.owner) return false;
      if(filters.country && !(c.countries||[]).includes(filters.country)) return false;
      return true;
    });
  }
  static run(cards, opts){
    opts = opts || {};
    let list = SearchEngine.applyFilters(cards, opts.filters);
    if(opts.search) list = list.filter(c=>SearchEngine.matches(c, opts.search));
    return list;
  }
}

/* ============================================================
   DEVELOPMENT AUTO-REQUIREMENTS
   ============================================================ */
class DevRequirements{
  static build(cards){
    const buckets = {Frontend:[], Backend:[], API:[], Admin:[], UI:[], Other:[]};
    const seen = new Map();
    cards.forEach(card=>{
      (card.checklists||[]).forEach(group=>{
        group.items.forEach(item=>{
          if(!item.checked) return;
          const cat = DevRequirements.CATEGORY_MAP[item.label] || 'Other';
          const key = cat + '::' + item.label + '::' + group.title;
          if(!seen.has(key)){
            const entry = {label:item.label, group:group.title, sources:[]};
            seen.set(key, entry);
            buckets[cat].push(entry);
          }
          seen.get(key).sources.push({id:card.id, title:card.title});
        });
      });
    });
    return buckets;
  }
}

/* ============================================================
   DEPENDENCY GRAPH LAYOUT
   ============================================================ */
class GraphLayout{
  static computeLevels(cards){
    const byId = new Map(cards.map(c=>[c.id,c]));
    const cache = new Map();
    function level(id, trail){
      if(cache.has(id)) return cache.get(id);
      if(trail.has(id)) return 0;
      const card = byId.get(id);
      if(!card) return 0;
      const deps = (card.dependencies||[]).filter(d=>byId.has(d));
      if(!deps.length){ cache.set(id,0); return 0; }
      const nextTrail = new Set(trail); nextTrail.add(id);
      const lvl = 1 + Math.max(...deps.map(d=>level(d, nextTrail)));
      cache.set(id, lvl);
      return lvl;
    }
    cards.forEach(c=>level(c.id, new Set()));
    return cache;
  }
  static columns(cards){
    const levels = GraphLayout.computeLevels(cards);
    const maxLevel = cards.length ? Math.max(...Array.from(levels.values())) : 0;
    const cols = Array.from({length:maxLevel+1}, ()=>[]);
    cards.forEach(c=>cols[levels.get(c.id)||0].push(c));
    return cols;
  }
}

/* ============================================================
   STATS
   ============================================================ */
function computeStats(cards){
  const byStatus = s => cards.filter(c=>c.status===s).length;
  const needDept = d => cards.filter(c=>c.department===d && c.status!=='Approved').length;
  return {
    total: cards.length,
    approved: byStatus('Approved'),
    discussion: byStatus('Discussion'),
    blocked: byStatus('Blocked'),
    needCEO: needDept('CEO'),
    needLegal: needDept('Legal'),
    needFinance: needDept('Finance'),
    needDevelopment: needDept('Development'),
  };
}
function launchReadiness(cards){
  const per = DEPARTMENTS.map(d=>{
    const list = cards.filter(c=>c.department===d.id);
    const approved = list.filter(c=>c.status==='Approved').length;
    const pct = list.length ? Math.round(approved/list.length*100) : 0;
    return {dept:d.id, pct, total:list.length, approved};
  });
  const overallApproved = cards.filter(c=>c.status==='Approved').length;
  const overall = cards.length ? Math.round(overallApproved/cards.length*100) : 0;
  return {overall, per};
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
class ExportManager{
  static download(filename, content, mime){
    const blob = new Blob([content], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  static toJSON(cards){
    ExportManager.download('decision-hub-export.json', JSON.stringify({cards, exportedAt:new Date().toISOString()}, null, 2), 'application/json');
  }
  static toMarkdown(cards){
    let md = '# Decision Hub — Export\n\n_Exported: ' + new Date().toLocaleString() + '_\n\n';
    DEPARTMENTS.forEach(dep=>{
      const list = cards.filter(c=>c.department===dep.id);
      if(!list.length) return;
      md += '## ' + dep.label + '\n\n';
      list.forEach(c=>{
        md += '### ' + c.title + ' `[' + c.status + ']` (' + c.priority + ')\n\n';
        md += '- Owner: ' + (c.owner || '—') + '\n- Description: ' + (c.description || '—') + '\n';
        if(c.dependencies.length){
          md += '- Depends on: ' + c.dependencies.map(id=>{ const d = cards.find(x=>x.id===id); return d ? d.title : id; }).join(', ') + '\n';
        }
        (c.checklists||[]).forEach(g=>{
          md += '\n**' + g.title + '**\n';
          g.items.forEach(it=>{ md += '- [' + (it.checked?'x':' ') + '] ' + it.label + '\n'; });
        });
        if(c.comments && c.comments.length){
          md += '\n**Comments**\n';
          c.comments.forEach(cm=>{ md += '- ' + cm.author + ': ' + cm.text + '\n'; });
        }
        md += '\n---\n\n';
      });
    });
    ExportManager.download('decision-hub-export.md', md, 'text/markdown');
  }
  static toCSV(cards){
    const headers = ['ID','Title','Department','Status','Priority','Owner','Description','Dependencies','Comments'];
    const rows = cards.map(c=>[
      c.id, c.title, c.department, c.status, c.priority, c.owner || '',
      (c.description || '').replace(/\n/g,' '),
      c.dependencies.map(id=>{ const d = cards.find(x=>x.id===id); return d ? d.title : id; }).join('; '),
      (c.comments || []).length
    ]);
    const escCsv = v => '"' + String(v).replace(/"/g,'""') + '"';
    const csv = [headers, ...rows].map(r=>r.map(escCsv).join(',')).join('\n');
    ExportManager.download('decision-hub-export.csv', csv, 'text/csv');
  }
  static toHTML(cards){
    let body = '<h1>Decision Hub — Snapshot</h1><p>Exported: ' + new Date().toLocaleString() + '</p>';
    DEPARTMENTS.forEach(dep=>{
      const list = cards.filter(c=>c.department===dep.id);
      if(!list.length) return;
      body += '<h2>' + esc(dep.label) + '</h2>';
      list.forEach(c=>{
        body += '<div style="border:1px solid #e4e4e7;border-radius:10px;padding:16px;margin-bottom:12px;">'
          + '<h3>' + esc(c.title) + ' <small>[' + esc(c.status) + ' / ' + esc(c.priority) + ']</small></h3>'
          + '<p>' + esc(c.description||'') + '</p>'
          + '<p><b>Owner:</b> ' + esc(c.owner||'—') + '</p>'
          + (c.checklists||[]).map(g=>'<b>' + esc(g.title) + '</b><ul>' + g.items.map(it=>'<li>' + (it.checked?'✅':'⬜') + ' ' + esc(it.label) + '</li>').join('') + '</ul>').join('')
          + '</div>';
      });
    });
    const html = '<!doctype html><html><head><meta charset="utf-8"><title>Decision Hub Snapshot</title></head><body style="font-family:sans-serif;max-width:900px;margin:40px auto;">' + body + '</body></html>';
    ExportManager.download('decision-hub-export.html', html, 'text/html');
  }
  static importJSON(file, onDone){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        const cards = Array.isArray(data) ? data : data.cards;
        if(!Array.isArray(cards)) throw new Error('Invalid format: expected {cards:[...]}');
        onDone(cards);
      }catch(e){
        alert('Import failed: ' + e.message);
      }
    };
    reader.readAsText(file);
  }
}

  const sc = STATUS_COLORS[card.status];
  const pc = PRIORITY_COLORS[card.priority];
  let progress = '';
  if(card.checklists && card.checklists.length){
    const total = card.checklists.reduce((s,g)=>s+g.items.length,0);
    const checked = card.checklists.reduce((s,g)=>s+g.items.filter(i=>i.checked).length,0);
    const pct = total ? Math.round(checked/total*100) : 0;
    progress = '<div class="tile-progress"><div class="tile-progress-bar" style="width:'+pct+'%"></div></div>' +
      '<span class="tile-progress-label secondary-ui">'+checked+'/'+total+' checklist items</span>';

  return '<div class="card-tile" draggable="true" data-action="open-card" data-card="'+card.id+'">' +
    '<div class="tile-top">' +
      '<span class="badge" style="background:'+sc.bg+';color:'+sc.fg+'">'+card.status+'</span>' +

/* ============================================================
   MERMAID INTERACTION SCHEME
   (auto-generated from live card/department data, kept in sync
   by re-running these builders on every store change)
   ============================================================ */
function mermaidId(id){ return 'n_' + String(id).replace(/[^a-zA-Z0-9_]/g,'_'); }
function mermaidLabel(str){
  return String(str||'').replace(/"/g,'#quot;').replace(/[\r\n]+/g,' ').slice(0,70);
}

function buildDeptInteractionMermaid(app){
  const cards = app.store.cards;
  const deptStats = DEPARTMENTS.map(d=>{
    const list = cards.filter(c=>c.department===d.id);
    const approved = list.filter(c=>c.status==='Approved').length;
    return {id:d.id, total:list.length, approved};
  });
  const edgeCounts = new Map();
  cards.forEach(card=>{
    (card.dependencies||[]).forEach(depId=>{
      const dep = app.store.getCard(depId);
      if(!dep || dep.department === card.department) return;
      const key = dep.department + '::' + card.department;
      edgeCounts.set(key, (edgeCounts.get(key)||0) + 1);
    });
  });
  const lines = ['flowchart LR'];
  deptStats.forEach(d=>{
    if(!d.total) return;
    const nid = mermaidId(d.id);
    lines.push('  ' + nid + '["' + mermaidLabel(d.id) + '<br/>' + d.approved + '/' + d.total + ' approved"]');
    lines.push('  style ' + nid + ' fill:' + deptColor(d.id) + '22,stroke:' + deptColor(d.id) + ',stroke-width:2px,color:#18181b');
  });
  edgeCounts.forEach((count, key)=>{
    const [from, to] = key.split('::');
    lines.push('  ' + mermaidId(from) + ' -->|' + count + '| ' + mermaidId(to));
  });
  if(!edgeCounts.size) lines.push('  %% no cross-department dependencies yet');
  return lines.join('\n');
}

function buildLevelMermaid(app){
  const cards = SearchEngine.run(app.store.cards, {filters: app.state.filters});
  const cols = GraphLayout.columns(cards);
  const idSet = new Set(cards.map(c=>c.id));
  const lines = ['flowchart LR'];
  cols.forEach((col, i)=>{
    lines.push('  subgraph L' + i + ' ["Level ' + i + '"]');
    lines.push('  direction TB');
    col.forEach(c=>{
      const nid = mermaidId(c.id);
      lines.push('    ' + nid + '["' + mermaidLabel(c.title) + '<br/><small>' + mermaidLabel(c.department) + ' · ' + mermaidLabel(c.status) + '</small>"]');
      const sc = STATUS_COLORS[c.status];
      lines.push('    style ' + nid + ' fill:' + sc.bg + ',stroke:' + deptColor(c.department) + ',stroke-width:2px,color:' + sc.fg);
    });
    lines.push('  end');
  });
  cards.forEach(card=>{
    (card.dependencies||[]).forEach(depId=>{
      if(!idSet.has(depId)) return;
      lines.push('  ' + mermaidId(depId) + ' --> ' + mermaidId(card.id));
    });
  });
  if(!cards.length) lines.push('  empty["No decisions match current filters"]');
  return lines.join('\n');
}

function filteredHypotheses(app){
  const f = app.state.hypFilters;
  return app.store.hypotheses.filter(h=>{
    if(f.department && h.department !== f.department) return false;
    if(f.status && h.status !== f.status) return false;
    if(f.sprint && (h.sprint||'') !== f.sprint) return false;
    if(app.state.search && app.state.view === 'hypotheses'){
      const q = app.state.search.toLowerCase();
      const blob = [h.title, h.description, h.author, h.sprint, h.report, orgLabel(h.department)].join(' ').toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  }).slice().sort((a,b)=>b.updatedAt - a.updatedAt);
}

          '<td><b>'+esc(h.title)+'</b></td>' +
          '<td><span class="dept-dot" style="background:'+orgColor(h.department)+'"></span>'+esc(orgLabel(h.department))+'</td>' +
          '<td>'+hypBadge(h.status)+'</td>' +
          '<td>'+esc(h.sprint||'—')+'</td>' +
          '<td>'+esc(h.author||'—')+'</td>' +
          '<td class="muted">'+formatDate(h.updatedAt)+'</td>' +
          '<td>'+esc(h.report||h.result||'—')+'</td>' +
        '</tr>'
      ).join('') +
      '</tbody></table></div></div>';
}

  return '<form data-action="auth-form">' +
    '<div class="field"><label>Имя</label><input type="text" name="name" required placeholder="Как к вам обращаться" value="'+esc(s.name||'')+'"></div>' +
    '<div class="field"><label>Отдел / роль</label>' +
      '<select name="department" required>' + orgSelectOptions(s.department || 'marketing') + '</select>' +
      '<p class="auth-hint">Маркетинг, продажи, аккаунтинг и разработка направляют идеи. Product рассматривает и ставит в спринт.</p>' +
    '</div>' +
    '<div class="modal-footer" style="border:none;padding-top:0;margin-top:8px;">' +

      '<button type="submit" class="btn-primary">Сохранить</button>' +

}

function renderAuthModal(app){
  return '<div class="modal-backdrop" data-action="close-modal">' +
    '<div class="modal new-card-modal">' +
      '<div class="modal-header"><h2 style="cursor:default;">Регистрация по отделу</h2><button class="icon-btn" data-action="close-modal">×</button></div>' +

function renderNewHypModal(app){

  const locked = app.session && app.session.department !== 'product';
  return '<div class="modal-backdrop" data-action="close-modal">' +
    '<div class="modal new-card-modal">' +
      '<div class="modal-header"><h2 style="cursor:default;">Новая гипотеза</h2><button class="icon-btn" data-action="close-modal">×</button></div>' +
      '<form data-action="new-hyp-form">' +
        '<div class="field"><label>Идея</label><input type="text" name="title" required placeholder="Что предлагаем реализовать"></div>' +
        '<div class="field"><label>Описание</label><textarea name="description" rows="4" placeholder="Контекст, проблема, ожидаемый эффект"></textarea></div>' +
        '<div class="field"><label>Ожидаемый результат</label><input type="text" name="expectedOutcome" placeholder="Например: рост конверсии регистрации"></div>' +
        '<div class="field"><label>Отдел</label>' +
          (locked
            ? '<input type="text" value="'+esc(orgLabel(dept))+'" disabled><input type="hidden" name="department" value="'+esc(dept)+'">'
            : '<select name="department">'+orgSelectOptions(dept, false)+'</select>') +
        '</div>' +
        '<div class="modal-footer"><span></span><button type="submit" class="btn-primary">Направить Product</button></div>' +
      '</form>' +
    '</div></div>';
}

function renderHypModal(h, app){
  const product = app.isProduct();
  const owner = app.isRegistered() && app.session.department === h.department && app.session.department !== 'product';
  const history = (h.history||[]).slice().reverse();
  let actions = '';
  if(product){
    if(h.status === 'submitted') actions += '<button class="btn-secondary" data-action="hyp-set-status" data-hyp="'+h.id+'" data-status="review">Взять на рассмотрение</button>';
    if(h.status === 'review' || h.status === 'submitted'){
      actions += '<button class="btn-primary" data-action="hyp-set-status" data-hyp="'+h.id+'" data-status="approved">Принять</button>';
      actions += '<button class="btn-danger" data-action="hyp-reject" data-hyp="'+h.id+'">Отклонить</button>';
    }
    if(h.status === 'approved' || h.status === 'review'){
      actions += '<button class="btn-primary" data-action="hyp-to-sprint" data-hyp="'+h.id+'">Добавить в спринт</button>';
    }
    if(h.status === 'sprint'){
      actions += '<button class="btn-primary" data-action="hyp-set-status" data-hyp="'+h.id+'" data-status="done">Отметить реализованной</button>';
    }
  }
  return '<div class="modal-backdrop" data-action="close-modal">' +
    '<div class="modal">' +
      '<div class="modal-header">' +
        '<div class="modal-header-main"><h2 style="cursor:default;">'+esc(h.title)+'</h2></div>' +
        '<button class="icon-btn" data-action="close-modal">×</button>' +
      '</div>' +
      '<div class="modal-meta">'+hypBadge(h.status) +
        (h.sprint ? ' <span class="tag mini">'+esc(h.sprint)+'</span>' : '') +
      '</div>' +
      '<div class="modal-fields" style="grid-template-columns:repeat(2,1fr);">' +
        '<div class="field"><label>Отдел</label><div>' +
          '<span class="dept-dot" style="background:'+orgColor(h.department)+'"></span>'+esc(orgLabel(h.department)) +
        '</div></div>' +
        '<div class="field"><label>Автор</label><div>'+esc(h.author||'—')+'</div></div>' +
      '</div>' +
      '<div class="field"><label>Описание</label><div>'+(h.description ? esc(h.description).replace(/\n/g,'<br>') : '<span class="muted">—</span>')+'</div></div>' +
      '<div class="field"><label>Ожидаемый результат</label><div>'+(h.expectedOutcome ? esc(h.expectedOutcome) : '<span class="muted">—</span>')+'</div></div>' +
      (h.rejectReason ? '<div class="field"><label>Причина отклонения</label><div>'+esc(h.rejectReason)+'</div></div>' : '') +
      (product ? (
        '<form data-action="hyp-report-form" data-hyp="'+h.id+'">' +
          '<div class="field"><label>Спринт</label><input type="text" name="sprint" value="'+esc(h.sprint||'')+'" placeholder="Например: Sprint 14"></div>' +
          '<div class="field"><label>Отчёт Product</label><textarea name="report" rows="3" placeholder="Статус реализации, метрики, вывод">'+esc(h.report||'')+'</textarea></div>' +
          '<button type="submit" class="btn-secondary">Сохранить отчёт</button>' +
        '</form>'
      ) : (h.report ? '<div class="field"><label>Отчёт Product</label><div>'+esc(h.report)+'</div></div>' : '')) +
      (actions ? '<div class="field"><label>Действия Product</label><div class="hyp-actions">'+actions+'</div></div>' : '') +
      '<div class="field"><label>История</label><div class="timeline">' +
        (history.length ? history.map(ev=>
          '<div class="timeline-item"><b>'+esc(ev.action)+'</b> · '+esc(ev.actor)+
          '<div class="muted">'+formatDate(ev.ts)+(ev.note ? ' · '+esc(ev.note) : '')+'</div></div>'
        ).join('') : '<p class="muted">Пока нет событий.</p>') +
      '</div></div>' +
      '<div class="modal-footer">' +
        ((product || owner) ? '<button class="btn-danger" data-action="delete-hyp" data-hyp="'+h.id+'">Удалить</button>' : '<span></span>') +
        '<span class="muted secondary-ui">Сохраняется в этом браузере</span>' +
      '</div>' +
    '</div></div>';
}

function renderSearchResults(app){
  const list = SearchEngine.run(app.store.cards, {search: app.state.search, filters: app.state.filters});
  return '<div class="view-header"><h1>Search results for "'+esc(app.state.search)+'"</h1>' +
    '<p class="muted">'+list.length+' match(es) · <button class="link-btn" data-action="clear-search">Clear search</button></p></div>' +
    '<div class="tile-grid">' + (list.map(renderCardTile).join('') || '<p class="muted">No matches.</p>') + '</div>';
}

/* ============================================================
   APP CONTROLLER
   ============================================================ */
class App{
  constructor(){
    this.store = new DataStore();
    this.session = loadSession();
    this.state = {
      view: 'hypotheses',
      search: '',
      filters: {department:'', status:'', owner:'', country:''},
      hypFilters: {department:'', status:'', sprint:''},
      hypTab: 'dashboard',
      openCardId: null,
      newCardOpen: false,
      openHypId: null,
      newHypOpen: false,
      authOpen: false,
      meeting: false,
      customTab: 'kz'
    };
    this.customDiagrams = {};
    CUSTOM_DIAGRAM_TABS.forEach(t=>{
      this.customDiagrams[t.id] = localStorage.getItem('decisionHub_customMermaid_'+t.id) || CUSTOM_DIAGRAM_DEFAULTS[t.id];
    });
    this._customMermaidDebounce = null;
  }
  getCustomMermaidSource(tab){ return this.customDiagrams[tab || this.state.customTab]; }
  setCustomMermaidSource(src, tab){
    tab = tab || this.state.customTab;
    this.customDiagrams[tab] = src;
    localStorage.setItem('decisionHub_customMermaid_'+tab, src);
    if(tab === this.state.customTab){
      const ta = document.getElementById('mermaid-custom-source');
      if(ta) ta.value = src;
      this.renderCustomMermaid();
    }
  }
  currentUser(){ return (this.session && this.session.name) || localStorage.getItem('chd_username') || ''; }
  isRegistered(){ return !!(this.session && this.session.name && this.session.department); }
  isProduct(){ return this.isRegistered() && this.session.department === 'product'; }
  actorName(){
    if(!this.isRegistered()) return this.currentUser() || '—';
    return this.session.name + ' (' + orgLabel(this.session.department) + ')';
  }
  closeOverlays(){
    this.state.openCardId = null;
    this.state.newCardOpen = false;
    this.state.openHypId = null;
    this.state.newHypOpen = false;
    this.state.authOpen = false;
  }
  viewToDept(view){
    const map = {legal:'Legal', finance:'Finance', accounting:'Accounting', operations:'Operations', development:'Development', ceo:'CEO'};
    return map[view] || null;
  }
  init(){
    document.getElementById('app-root').innerHTML = renderShell();
    this.store.subscribe(()=>this.renderAll());
    this.bindEvents();
    this.renderAll();
  }
  bindEvents(){
    document.addEventListener('click', e=>this.handleClick(e));
    document.addEventListener('dblclick', e=>this.handleDblClick(e));
    document.addEventListener('change', e=>this.handleChange(e));
    document.addEventListener('input', e=>this.handleInput(e));
    document.addEventListener('submit', e=>this.handleSubmit(e));
    document.addEventListener('keydown', e=>this.handleKeydown(e));
    document.addEventListener('dragstart', e=>this.handleDragStart(e));
    document.addEventListener('dragend', e=>this.handleDragEnd(e));
    document.addEventListener('dragover', e=>this.handleDragOver(e));
    document.addEventListener('dragleave', e=>this.handleDragLeave(e));
    document.addEventListener('drop', e=>this.handleDrop(e));
  }

  setView(view){
    this.state.view = view;
    this.state.search = '';
    const si = document.getElementById('search-input');
    if(si) si.value = '';
    this.renderSidebarActive();
    this.renderMain();
  }

  renderAll(){
    this.renderSidebarActive();
    renderSessionSlot(this);
    this.renderMain();
    this.renderModal();
  }
  renderSidebarActive(){
    document.querySelectorAll('.nav-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.view === this.state.view);
    });
  }
  renderMain(){
    const main = document.getElementById('main-content');
    if(!main) return;
    if(this.state.search && this.state.search.trim() && this.state.view !== 'hypotheses'){
      main.innerHTML = renderSearchResults(this);
      return;
    }
    switch(this.state.view){
      case 'overview':    main.innerHTML = renderOverview(this); break;
      case 'hypotheses':  main.innerHTML = renderHypotheses(this); break;
      case 'legal':       main.innerHTML = renderDepartment(this, 'Legal'); break;
      case 'finance':     main.innerHTML = renderDepartment(this, 'Finance'); break;
      case 'accounting':  main.innerHTML = renderDepartment(this, 'Accounting'); break;
      case 'operations':  main.innerHTML = renderDepartment(this, 'Operations'); break;
      case 'development': main.innerHTML = renderDevelopment(this); break;
      case 'ceo':          main.innerHTML = renderCEODashboard(this); break;
      case 'decisions':   main.innerHTML = renderKanban(this); break;
      case 'graph':        main.innerHTML = renderGraph(this); this.drawGraphEdges(); break;
      case 'scheme':        main.innerHTML = renderScheme(this); this.renderMermaidScheme(); this.renderCustomMermaid(); break;
      default:              main.innerHTML = renderOverview(this);
    }
  }
  renderModal(){
    const root = document.getElementById('modal-root');
    if(!root) return;
    if(this.state.authOpen){
      root.innerHTML = renderAuthModal(this);
    } else if(this.state.newHypOpen){
      root.innerHTML = renderNewHypModal(this);
    } else if(this.state.openHypId){
      const hyp = this.store.getHypothesis(this.state.openHypId);
      if(!hyp){ this.state.openHypId = null; root.innerHTML = ''; return; }
      root.innerHTML = renderHypModal(hyp, this);
    } else if(this.state.openCardId){
      const card = this.store.getCard(this.state.openCardId);
      if(!card){ this.state.openCardId = null; root.innerHTML = ''; return; }
      root.innerHTML = renderCardModal(card, this);
    } else if(this.state.newCardOpen){
      root.innerHTML = renderNewCardModal(this);
    } else {
      root.innerHTML = '';
    }
  }

  renderMermaidScheme(){
    if(typeof mermaid === 'undefined') return;
    const deptEl = document.getElementById('mermaid-dept');
    const levelEl = document.getElementById('mermaid-levels');
    const targets = [];
    if(deptEl){ deptEl.removeAttribute('data-processed'); deptEl.textContent = buildDeptInteractionMermaid(this); targets.push(deptEl); }
    if(levelEl){ levelEl.removeAttribute('data-processed'); levelEl.textContent = buildLevelMermaid(this); targets.push(levelEl); }
    if(!targets.length) return;
    try{
      mermaid.run({nodes: targets}).catch(err=>console.error('Mermaid render error', err));
    }catch(err){
      console.error('Mermaid render error', err);
    }
  }

  renderCustomMermaid(){
    if(typeof mermaid === 'undefined') return;
    const el = document.getElementById('mermaid-custom');
    if(!el) return;
    const errEl = document.getElementById('mermaid-custom-error');
    el.removeAttribute('data-processed');
    el.textContent = this.customDiagrams[this.state.customTab];
    if(errEl) errEl.textContent = '';
    mermaid.run({nodes:[el]}).catch(err=>{
      console.error('Custom mermaid render error', err);
      if(errEl) errEl.textContent = 'Diagram syntax error: ' + (err && err.message ? err.message : err);
    });
  }

  drawGraphEdges(){
    const wrap = document.getElementById('graph-wrap');
    const svg = document.getElementById('graph-svg');
    if(!wrap || !svg) return;
    const wrapRect = wrap.getBoundingClientRect();
    svg.setAttribute('width', wrap.scrollWidth);
    svg.setAttribute('height', wrap.scrollHeight);
    svg.innerHTML = '<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"></path></marker></defs>';
    const cards = SearchEngine.run(this.store.cards, {filters: this.state.filters});
    const idSet = new Set(cards.map(c=>c.id));
    cards.forEach(card=>{
      (card.dependencies||[]).forEach(depId=>{
        if(!idSet.has(depId)) return;
        const fromEl = document.getElementById('gnode-'+depId);
        const toEl = document.getElementById('gnode-'+card.id);
        if(!fromEl || !toEl) return;
        const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect();
        const x1 = fr.right - wrapRect.left + wrap.scrollLeft;
        const y1 = fr.top + fr.height/2 - wrapRect.top + wrap.scrollTop;
        const x2 = tr.left - wrapRect.left + wrap.scrollLeft;
        const y2 = tr.top + tr.height/2 - wrapRect.top + wrap.scrollTop;
        const midX = (x1+x2)/2;
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', 'M'+x1+','+y1+' C'+midX+','+y1+' '+midX+','+y2+' '+x2+','+y2);
        path.setAttribute('stroke', '#cbd5e1');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrowhead)');
        svg.appendChild(path);
      });
    });
  }

  editInline(el, currentValue, onCommit, multiline){
    const input = document.createElement(multiline ? 'textarea' : 'input');
    input.value = currentValue;
    input.className = 'inline-edit-box';
    if(multiline) input.rows = 3;
    el.replaceWith(input);
    input.focus();
    input.select();
    let committed = false;
    const commit = () => { if(committed) return; committed = true; onCommit(input.value.trim()); };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev=>{
      if(ev.key === 'Enter' && !multiline){ ev.preventDefault(); input.blur(); }
      if(ev.key === 'Escape'){ committed = true; this.renderAll(); }
    });
  }

  /* ---------- event handlers ---------- */
  handleClick(e){
    if(e.target.classList && e.target.classList.contains('modal-backdrop')){
      this.closeOverlays();
      this.renderModal();
      return;
    }
    if(e.target.closest('.modal')){
      const actionEl = e.target.closest('[data-action]');
      if(actionEl && actionEl.classList.contains('modal-backdrop')) return;
    }
    const menu = document.getElementById('export-menu');
    if(menu && menu.classList.contains('open') && !e.target.closest('#export-menu-wrap')){
      menu.classList.remove('open');
    }
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    switch(action){
      case 'nav':
        this.setView(el.dataset.view);
        document.getElementById('app').classList.remove('sidebar-open');
        break;
      case 'toggle-meeting':
        document.body.classList.toggle('meeting-mode');
        this.state.meeting = document.body.classList.contains('meeting-mode');
        el.classList.toggle('active', this.state.meeting);
        break;
      case 'toggle-sidebar':
        document.getElementById('app').classList.toggle('sidebar-open');
        break;
      case 'open-new-card':
        this.state.newCardOpen = true;
        this.state.openCardId = null;
        this.renderModal();
        break;
      case 'open-card':
        this.state.openCardId = el.dataset.card;
        this.state.newCardOpen = false;
        this.renderModal();
        break;
      case 'close-modal':
        this.closeOverlays();
        this.renderModal();
        break;
      case 'open-auth':
        this.closeOverlays();
        this.state.authOpen = true;
        this.renderModal();
        break;
      case 'logout':
        this.session = null;
        saveSession(null);
        this.closeOverlays();
        this.renderAll();
        break;
      case 'open-new-hyp':
        if(!this.isRegistered()){ this.state.authOpen = true; this.renderModal(); break; }
        if(this.isProduct()){ alert('Идеи направляют отделы. Смените регистрацию на отдел, чтобы создать гипотезу.'); break; }
        this.closeOverlays();
        this.state.newHypOpen = true;
        this.renderModal();
        break;
      case 'open-hypothesis':
        this.closeOverlays();
        this.state.openHypId = el.dataset.hyp;
        this.renderModal();
        break;
      case 'hyp-tab':
        this.state.hypTab = el.dataset.tab;
        this.renderMain();
        break;
      case 'hyp-focus-dept':
        this.state.hypFilters.department = el.dataset.dept;
        this.state.hypTab = 'dashboard';
        this.renderMain();
        break;
      case 'hyp-set-status': {
        if(!this.isProduct()) break;
        const hyp = this.store.getHypothesis(el.dataset.hyp);
        if(!hyp) break;
        const next = el.dataset.status;
        const label = hypStatus(next).label;
        pushHypHistory(hyp, this.actorName(), 'Статус: '+label, '');
        this.store.updateHypothesis(hyp.id, {status: next});
        break;
      }
      case 'hyp-reject': {
        if(!this.isProduct()) break;
        const hyp = this.store.getHypothesis(el.dataset.hyp);
        if(!hyp) break;
        const reason = prompt('Причина отклонения:');
        if(reason === null) break;
        pushHypHistory(hyp, this.actorName(), 'Отклонена', reason.trim());
        this.store.updateHypothesis(hyp.id, {status:'rejected', rejectReason: reason.trim()});
        break;
      }
      case 'hyp-to-sprint': {
        if(!this.isProduct()) break;
        const hyp = this.store.getHypothesis(el.dataset.hyp);
        if(!hyp) break;
        const sprint = prompt('Название спринта:', hyp.sprint || '');
        if(sprint === null) break;
        const name = sprint.trim();
        if(!name){ alert('Укажите спринт'); break; }
        pushHypHistory(hyp, this.actorName(), 'Добавлена в спринт', name);
        this.store.updateHypothesis(hyp.id, {status:'sprint', sprint: name});
        break;
      }
      case 'delete-hyp': {
        const hyp = this.store.getHypothesis(el.dataset.hyp);
        if(!hyp) break;
        const can = this.isProduct() || (this.isRegistered() && this.session.department === hyp.department);
        if(!can) break;
        if(confirm('Удалить гипотезу «'+hyp.title+'»?')){
          this.state.openHypId = null;
          this.store.deleteHypothesis(hyp.id);
        }
        break;
      }
      case 'delete-card': {
        const card = this.store.getCard(el.dataset.card);
        if(card && confirm('Delete "' + card.title + '"? This cannot be undone.')){
          this.state.openCardId = null;
          this.store.deleteCard(el.dataset.card);
        }
        break;
      }
      case 'remove-dependency': {
        const card = this.store.getCard(el.dataset.card);
        card.dependencies = card.dependencies.filter(d=>d!==el.dataset.dep);
        card.updatedAt = Date.now();
        this.store.save();
        break;
      }
      case 'remove-checklist-item': {
        const card = this.store.getCard(el.dataset.card);
        const group = card.checklists.find(g=>g.id===el.dataset.group);
        group.items = group.items.filter(i=>i.id!==el.dataset.item);
        card.updatedAt = Date.now();
        this.store.save();
        break;
      }
      case 'remove-checklist-group': {
        const card = this.store.getCard(el.dataset.card);
        card.checklists = card.checklists.filter(g=>g.id!==el.dataset.group);
        card.updatedAt = Date.now();
        this.store.save();
        break;
      }
      case 'clear-filters':
        this.state.filters = {department:'', status:'', owner:'', country:''};
        this.renderMain();
        break;
      case 'clear-search':
        this.state.search = '';
        { const si = document.getElementById('search-input'); if(si) si.value = ''; }
        this.renderMain();
        break;
      case 'export-json': ExportManager.toJSON(this.store.cards); break;
      case 'export-md':   ExportManager.toMarkdown(this.store.cards); break;
      case 'export-csv':  ExportManager.toCSV(this.store.cards); break;
      case 'export-html': ExportManager.toHTML(this.store.cards); break;
      case 'trigger-import': document.getElementById('import-file-input').click(); break;
      case 'toggle-export-menu': document.getElementById('export-menu').classList.toggle('open'); break;
      case 'custom-tab':
        this.state.customTab = el.dataset.tab;
        this.renderMain();
        break;
    }
  }

  handleDblClick(e){
    const el = e.target.closest('[data-editable]');
    if(!el) return;
    const type = el.dataset.editable;
    const cardId = el.dataset.card;
    const card = this.store.getCard(cardId);
    if(!card) return;
    if(type === 'title'){
      this.editInline(el, card.title, val=>{ this.store.updateCard(cardId, {title: val || card.title}); });
    } else if(type === 'description'){
      this.editInline(el, card.description || '', val=>{ this.store.updateCard(cardId, {description: val}); }, true);
    } else if(type === 'owner'){
      this.editInline(el, card.owner || '', val=>{ this.store.updateCard(cardId, {owner: val}); });
    } else if(type === 'checklist-title'){
      const group = card.checklists.find(g=>g.id===el.dataset.group);
      this.editInline(el, group.title, val=>{ group.title = val || group.title; card.updatedAt = Date.now(); this.store.save(); });
    } else if(type === 'checklist-item-label'){
      const group = card.checklists.find(g=>g.id===el.dataset.group);
      const item = group.items.find(i=>i.id===el.dataset.item);
      this.editInline(el, item.label, val=>{ item.label = val || item.label; card.updatedAt = Date.now(); this.store.save(); });
    }
  }

  handleChange(e){
    if(e.target.id === 'import-file-input'){
      const file = e.target.files[0];
      if(!file) return;
      if(!confirm('Import will replace ALL current data. Continue?')){ e.target.value=''; return; }
      ExportManager.importJSON(file, cards=>{
        cards.forEach(c=>{
          c.comments = c.comments || [];
          c.dependencies = c.dependencies || [];
          c.checklists = c.checklists || [];
          c.countries = c.countries || [];
        });
        this.store.replaceAll(cards);
        e.target.value = '';
      });
      return;
    }
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action === 'field-change'){
      this.store.updateCard(el.dataset.card, {[el.dataset.field]: el.value});
    } else if(action === 'add-dependency'){
      if(el.value){
        const card = this.store.getCard(el.dataset.card);
        card.dependencies.push(el.value);
        card.updatedAt = Date.now();
        this.store.save();
      }
    } else if(action === 'toggle-checklist-item'){
      const card = this.store.getCard(el.dataset.card);
      const group = card.checklists.find(g=>g.id===el.dataset.group);
      const item = group.items.find(i=>i.id===el.dataset.item);
      item.checked = el.checked;
      if(group.title === 'Обязательность'){
        card.countries = group.items.filter(i=>i.checked).map(i=>i.label);
      }
      card.updatedAt = Date.now();
      this.store.save();
    } else if(action === 'hyp-filter'){
      this.state.hypFilters[el.dataset.field] = el.value;
      this.renderMain();
    }
  }

  handleInput(e){
    if(e.target.id === 'search-input'){
      this.state.search = e.target.value;
      this.renderMain();
    } else if(e.target.id === 'mermaid-custom-source'){
      const val = e.target.value;
      const tab = this.state.customTab;
      clearTimeout(this._customMermaidDebounce);
      this._customMermaidDebounce = setTimeout(()=>{
        this.customDiagrams[tab] = val;
        localStorage.setItem('decisionHub_customMermaid_'+tab, val);
        this.renderCustomMermaid();
      }, 400);
    }
  }

  handleSubmit(e){
    const form = e.target.closest('[data-action]');
    if(!form || form.tagName !== 'FORM') return;
    e.preventDefault();
    const action = form.dataset.action;
    if(action === 'new-card-form'){
      const fd = new FormData(form);
      const title = (fd.get('title') || '').trim();
      if(!title){ alert('Title is required'); return; }
      const department = fd.get('department');
      const card = {
        id: uid('card'), title, description: (fd.get('description')||'').trim(),
        department, status: fd.get('status'), priority: fd.get('priority'), owner: (fd.get('owner')||'').trim(),
        comments: [], dependencies: [], countries: [],
        checklists: department === 'Legal' ? SeedData.checklistTemplate() : [],
        createdAt: Date.now(), updatedAt: Date.now()
      };
      this.state.newCardOpen = false;
      this.state.openCardId = card.id;
      this.store.addCard(card);
    } else if(action === 'add-checklist-item-form'){
      const cardId = form.dataset.card, groupId = form.dataset.group;
      const input = form.querySelector('.inline-add-input');
      const label = input.value.trim();
      if(!label) return;
      const card = this.store.getCard(cardId);
      const group = card.checklists.find(g=>g.id===groupId);
      group.items.push({id: uid('itm'), label, checked:false});
      card.updatedAt = Date.now();
      this.store.save();
    } else if(action === 'add-checklist-group-form'){
      const cardId = form.dataset.card;
      const input = form.querySelector('.inline-add-input');
      const title = input.value.trim();
      if(!title) return;
      const card = this.store.getCard(cardId);
      card.checklists = card.checklists || [];
      card.checklists.push({id: uid('chk'), title, items: []});
      card.updatedAt = Date.now();
      this.store.save();
    } else if(action === 'add-comment-form'){
      const cardId = form.dataset.card;
      const author = form.querySelector('.comment-author-input').value.trim() || 'Anonymous';
      const text = form.querySelector('.comment-text-input').value.trim();
      if(!text) return;
      localStorage.setItem('chd_username', author);
      const card = this.store.getCard(cardId);
      card.comments = card.comments || [];
      card.comments.push({id: uid('cmt'), author, text, ts: Date.now()});
      card.updatedAt = Date.now();
      this.store.save();
    } else if(action === 'auth-form'){
      const fd = new FormData(form);
      const name = (fd.get('name') || '').trim();
      const department = fd.get('department');
      if(!name){ alert('Укажите имя'); return; }
      if(!orgById(department)){ alert('Выберите отдел'); return; }
      this.session = {name, department, registeredAt: Date.now()};
      saveSession(this.session);
      localStorage.setItem('chd_username', name);
      this.state.authOpen = false;
      this.renderAll();
    } else if(action === 'new-hyp-form'){
      if(!this.isRegistered()){ this.state.newHypOpen = false; this.state.authOpen = true; this.renderModal(); return; }
      if(this.isProduct()){ alert('Идеи направляют отделы.'); return; }
      const fd = new FormData(form);
      const title = (fd.get('title') || '').trim();
      if(!title){ alert('Укажите идею'); return; }
      const department = this.session.department;
      const hyp = {
        id: uid('hyp'),
        title,
        description: (fd.get('description')||'').trim(),
        expectedOutcome: (fd.get('expectedOutcome')||'').trim(),
        department,
        author: this.session.name,
        status: 'submitted',
        sprint: '',
        report: '',
        rejectReason: '',
        history: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      pushHypHistory(hyp, this.actorName(), 'Направлена на реализацию', '');
      this.state.newHypOpen = false;
      this.state.openHypId = hyp.id;
      this.store.addHypothesis(hyp);
    } else if(action === 'hyp-report-form'){
      if(!this.isProduct()) return;
      const hyp = this.store.getHypothesis(form.dataset.hyp);
      if(!hyp) return;
      const fd = new FormData(form);
      const sprint = (fd.get('sprint')||'').trim();
      const report = (fd.get('report')||'').trim();
      pushHypHistory(hyp, this.actorName(), 'Обновлён отчёт', sprint);
      this.store.updateHypothesis(hyp.id, {sprint, report});
    }
  }

  handleKeydown(e){
    if(e.key === 'Escape' && (this.state.openCardId || this.state.newCardOpen || this.state.openHypId || this.state.newHypOpen || this.state.authOpen)){
      this.closeOverlays();
      this.renderModal();
    }
  }

  handleDragStart(e){
    const hypTile = e.target.closest('.hyp-tile');
    if(hypTile){
      if(!this.isProduct()){ e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', 'hyp:'+hypTile.dataset.hyp);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>hypTile.classList.add('dragging'), 0);
      return;
    }
    const tile = e.target.closest('.card-tile');
    if(!tile) return;
    e.dataTransfer.setData('text/plain', tile.dataset.card);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(()=>tile.classList.add('dragging'), 0);
  }
  handleDragEnd(e){
    const tile = e.target.closest('.card-tile');
    if(tile) tile.classList.remove('dragging');
    document.querySelectorAll('.kanban-col-body.drag-over').forEach(el=>el.classList.remove('drag-over'));
  }
  handleDragOver(e){
    const hypZone = e.target.closest('[data-hyp-dropzone]');
    if(hypZone){
      if(!this.isProduct()) return;
      e.preventDefault();
      hypZone.classList.add('drag-over');
      return;
    }
    const zone = e.target.closest('[data-dropzone]');
    if(!zone) return;
    e.preventDefault();
    zone.classList.add('drag-over');
  }
  handleDragLeave(e){
    const hypZone = e.target.closest('[data-hyp-dropzone]');
    if(hypZone) hypZone.classList.remove('drag-over');
    const zone = e.target.closest('[data-dropzone]');
    if(zone) zone.classList.remove('drag-over');
  }
  handleDrop(e){
    const hypZone = e.target.closest('[data-hyp-dropzone]');
    if(hypZone){
      e.preventDefault();
      hypZone.classList.remove('drag-over');
      if(!this.isProduct()) return;
      const raw = e.dataTransfer.getData('text/plain');
      if(!raw || raw.indexOf('hyp:') !== 0) return;
      const hyp = this.store.getHypothesis(raw.slice(4));
      if(!hyp) return;
      const next = hypZone.dataset.hypStatus;
      if(next === hyp.status) return;
      let sprint = hyp.sprint || '';
      if(next === 'sprint' && !sprint){
        const entered = prompt('Название спринта:');
        if(entered === null) return;
        sprint = entered.trim();
        if(!sprint){ alert('Укажите спринт'); return; }
      }
      const patch = {status: next};
      if(sprint) patch.sprint = sprint;
      if(next === 'rejected' && !hyp.rejectReason){
        const reason = prompt('Причина отклонения:') || '';
        patch.rejectReason = reason.trim();
        pushHypHistory(hyp, this.actorName(), 'Отклонена', patch.rejectReason);
      } else {
        pushHypHistory(hyp, this.actorName(), 'Статус: '+hypStatus(next).label, sprint);
      }
      this.store.updateHypothesis(hyp.id, patch);
      return;
    }
    const zone = e.target.closest('[data-dropzone]');
    if(!zone) return;
    e.preventDefault();
    zone.classList.remove('drag-over');
    const cardId = e.dataTransfer.getData('text/plain');
    if(cardId && cardId.indexOf('hyp:') !== 0) this.store.updateCard(cardId, {status: zone.dataset.status});
  }
}

document.addEventListener('DOMContentLoaded', ()=>{
  window.app = new App();
  window.app.init();
});
</script>
</body>
</html>
